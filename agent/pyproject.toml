[project]
name = "tracebow-agent"
version = "0.2.0"
description = "LangGraph-based SRE agent for CI/CD root cause analysis with a Git-backed Markdown wiki"
requires-python = ">=3.11"
dependencies = [
    # API layer
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    # LLM orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    # Task queue (Celery + Redis for broker and result backend)
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # Telemetry database (Postgres primary, SQLite fallback for local/tests)
    "sqlalchemy[asyncio]>=2.0.25",
    "psycopg[binary]>=3.1.17",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    # Git-backed wiki
    "gitpython>=3.1.50",
    "markdown-it-py>=3.0.0",
    # Config / validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Crypto for deploy-key storage (at-rest AES-GCM on top of a KEK env)
    "cryptography>=48.0.1",
]

[tool.uv]
# Pin transitive deps with known CVEs until upstream ranges catch up.
constraint-dependencies = [
    "starlette>=1.3.1",
    "langsmith>=0.8.18",
    "idna>=3.15",
    "mako>=1.3.12",
    "msgpack>=1.2.1",
    "pip>=26.1.2",
]

[project.optional-dependencies]
# Kept for `pip install -e ".[dev]"` / published wheels; uv uses [dependency-groups] below.
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-redis",
    "pip-audit",
    "pre-commit",
]

[dependency-groups]
# PEP 735 — uv includes the `dev` group by default on `uv sync` / `uv run` (use `--no-dev` to skip).
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-redis",
    "pip-audit",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracebow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/tracebow/api/routes.py" = ["B008"]  # FastAPI's Depends(...) in defaults is idiomatic
"tests/*" = ["E501"]  # long inline fixtures (e.g. deploy keys) are fine in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
targets = ["src/tracebow"]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
