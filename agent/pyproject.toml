[project]
name = "tracebow-agent"
version = "0.1.0"
description = "Agent orchestration and RAG engine for CI/CD root cause analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-ollama>=0.0.1",
    "chromadb>=0.5.0",
    "neo4j>=5.15.0",
    "httpx>=0.26.0",
    "slack-sdk>=3.26.0",
    "atlassian-python-api>=3.41.0",
    "PyGithub>=2.1.0",
    "torch>=2.2.0",
    "sentence-transformers>=2.2.0",
    "rank-bm25>=0.2.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "flower>=2.0.0",
]

[project.optional-dependencies]
# Kept for `pip install -e ".[dev]"` / published wheels; uv uses [dependency-groups] below.
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-redis", "pip-audit", "pre-commit"]

[dependency-groups]
# PEP 735 — uv includes the `dev` group by default on `uv sync` / `uv run` (use `--no-dev` to skip).
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-redis",
    "pip-audit",
    "pre-commit",
]

# CPU-only PyTorch: PyPI serves CUDA wheels on Linux (multi‑GB nvidia-* deps).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracebow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
targets = ["src/tracebow"]
skips = ["B101"]  # allow assert in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
