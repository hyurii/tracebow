# Tracebow AI RCA Integration - GitHub Actions (zero-egress / self-hosted)
#
# Copy to .github/workflows/tracebow-rca-trigger.yml
#
# Prerequisites:
# - Self-hosted runner on the same network as Tracebow (labels: self-hosted, tracebow)
# - GITHUB_TOKEN on the Tracebow server (enables /webhooks/github and outbound API tools)
# - Runner can reach http://agent:8080 (Docker service name or internal hostname)

name: AI RCA on Failure

on:
  workflow_run:
    workflows: ["CI", "build", "test"]  # Adjust to your primary CI workflow names
    types:
      - completed

jobs:
  trigger-rca:
    runs-on: [self-hosted, tracebow, zero-egress]
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    env:
      TRACEBOW_WEBHOOK_URL: http://agent:8080/api/v1/webhooks/github
    steps:
      - name: Notify Tracebow
        run: |
          RUN_JSON='${{ toJson(github.event.workflow_run) }}'

          jq -n \
            --arg repository "${{ github.repository }}" \
            --argjson run "$RUN_JSON" \
            --arg event "workflow_run" \
            '{
              repository: $repository,
              run_id: $run.id,
              workflow_name: $run.name,
              head_branch: $run.head_branch,
              head_sha: $run.head_sha,
              run_url: $run.html_url,
              event: $event,
              pull_request_number: ($run.pull_requests[0].number // null)
            }' \
          | curl -sS -X POST "${TRACEBOW_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d @- \
          || true
