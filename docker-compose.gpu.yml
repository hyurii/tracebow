# Optional NVIDIA GPU passthrough for Ollama (Linux hosts only).
#
# Use when the machine has an NVIDIA GPU and nvidia-container-toolkit is installed.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Or set in .env: COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
#
# Not for Docker Desktop on macOS/Windows in typical setups — Ollama in-container
# there is usually CPU-only; for Apple Silicon GPU use native Ollama instead.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
