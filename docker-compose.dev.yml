# Tracebow — DEVELOPMENT compose file.
#
# Builds images from local source code. Exposes all debug ports
# (RabbitMQ management, Neo4j browser, Flower, ChromaDB, Redis, Ollama).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Rebuild after code changes:
#   docker compose -f docker-compose.dev.yml up -d --build agent

x-tracebow-agent-environment: &tracebow-agent-environment
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
  OLLAMA_MODEL_RCA: ${OLLAMA_MODEL_RCA:-phi4-mini}
  CHROMA_HOST: chromadb
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: ${CHROMA_COLLECTION:-tracebow_embeddings}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-tracebow}:${RABBITMQ_PASSWORD:-tracebow}@rabbitmq:5672//
  REDIS_URL: redis://redis:6379/0
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
  CELERY_RCA_RATE_LIMIT: ${CELERY_RCA_RATE_LIMIT:-10/m}
  JENKINS_URL: ${JENKINS_URL:-}
  JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-}
  JENKINS_USER: ${JENKINS_USER:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  JIRA_URL: ${JIRA_URL:-}
  JIRA_EMAIL: ${JIRA_EMAIL:-}
  JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  API_HOST: ${API_HOST:-0.0.0.0}
  API_PORT: ${API_PORT:-8080}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tracebow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tracebow}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # AI / data stores
  # ---------------------------------------------------------------------------

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 60); do
          if ollama list >/dev/null 2>&1; then break; fi
          sleep 2
        done
        ollama pull phi4-mini
        ollama pull llama3.2:3b
        ollama pull nomic-embed-text
    restart: "no"

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "${CHROMA_PORT:-8000}:8000"

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"

  # ---------------------------------------------------------------------------
  # Application (built from source)
  # ---------------------------------------------------------------------------

  agent:
    build: ./agent
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      <<: *tracebow-agent-environment
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
      chromadb:
        condition: service_started
      neo4j:
        condition: service_started

  celery-worker:
    build: ./agent
    command: >
      celery -A tracebow.celery_app worker
      --loglevel=info
      --queues=rca,default,maintenance
      --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
      --max-tasks-per-child=200
      --without-heartbeat
    environment:
      <<: *tracebow-agent-environment
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      chromadb:
        condition: service_started
      neo4j:
        condition: service_started

  celery-beat:
    build: ./agent
    command: >
      celery -A tracebow.celery_app beat
      --loglevel=info
    environment:
      <<: *tracebow-agent-environment
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build: ./agent
    command: >
      celery -A tracebow.celery_app flower
      --port=5555
      --broker_api=http://${RABBITMQ_USER:-tracebow}:${RABBITMQ_PASSWORD:-tracebow}@rabbitmq:15672/api/
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      <<: *tracebow-agent-environment
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  portal:
    build: ./portal
    ports:
      - "${PORTAL_PORT:-3000}:80"
    depends_on:
      - agent

volumes:
  rabbitmq_data:
  redis_data:
  ollama_data:
  chroma_data:
  neo4j_data:
