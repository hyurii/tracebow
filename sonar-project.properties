# SonarCloud configuration — public, no secrets.
# Token is provided via SONAR_TOKEN env var in CI.

sonar.organization=tracebow
sonar.projectKey=tracebow_tracebow
sonar.projectName=Tracebow

sonar.sources=agent/src,portal/src,tracebow-cli
sonar.tests=agent/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/venv/**

# Python
sonar.python.version=3.12

# Go
sonar.go.file.suffixes=.go

# TypeScript
sonar.typescript.lcov.reportPaths=portal/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
