repos:
  # ── General hygiene ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^portal/node_modules/
      - id: end-of-file-fixer
        exclude: ^portal/node_modules/
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^agent/uv\.lock$
      - id: detect-private-key

  # ── Python (agent/) ────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [types-redis]
        files: ^agent/src/

  # ── Python security (agent/) ───────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "agent/pyproject.toml"]
        files: ^agent/src/
        additional_dependencies: ["bandit[toml]"]

  # ── TypeScript / React (portal/) ───────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, json, yaml, markdown]
        files: ^portal/
        exclude: ^portal/node_modules/

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.21.0
    hooks:
      - id: eslint
        files: ^portal/src/.*\.[jt]sx?$
        additional_dependencies:
          - eslint@9.21.0
          - "@eslint/js@9.21.0"
          - typescript-eslint@8.25.0
          - eslint-plugin-react-hooks@5.2.0

  # ── Go (tracebow-cli/) ────────────────────────────────────────────
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.0.2
    hooks:
      # go.work at repo root lets golangci resolve ./tracebow-cli when run from root.
      - id: golangci-lint-full
        args: [./tracebow-cli/...]
        files: ^tracebow-cli/

  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        entry: bash -c 'cd tracebow-cli && go vet ./...'
        language: system
        files: ^tracebow-cli/.*\.go$
        pass_filenames: false

      - id: go-build
        name: go build (smoke test)
        entry: bash -c 'cd tracebow-cli && go build -o /dev/null .'
        language: system
        files: ^tracebow-cli/.*\.go$
        pass_filenames: false

      - id: govulncheck
        name: govulncheck
        entry: bash -c 'cd tracebow-cli && govulncheck ./...'
        language: system
        files: ^tracebow-cli/.*\.go$
        pass_filenames: false
        stages: [pre-push]

      - id: hadolint
        name: hadolint
        language: system
        entry: bash scripts/hadolint.sh
        types: [dockerfile]
        files: ^(agent|portal)/Dockerfile$

  # ── Security ───────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/returntocorp/semgrep
    rev: v1.112.0
    hooks:
      - id: semgrep
        args: ["--config", "auto", "--error"]
        stages: [pre-push]

  # ── Docker ─────────────────────────────────────────────────────────
  # hadolint runs via scripts/hadolint.sh (host binary or Docker)

  # ── IaC / Compose ──────────────────────────────────────────────────
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.344
    hooks:
      - id: checkov
        files: (docker-compose.*\.ya?ml|Dockerfile|\.github/workflows/.*)$

  # ── GitHub Actions ─────────────────────────────────────────────────
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
