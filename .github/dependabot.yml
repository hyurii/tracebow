version: 2
updates:
  # Python (agent)
  - package-ecosystem: pip
    directory: /agent
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Node.js (portal)
  - package-ecosystem: npm
    directory: /portal
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "javascript"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Go (CLI)
  - package-ecosystem: gomod
    directory: /tracebow-cli
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      actions:
        update-types: ["minor", "patch"]

  # Docker (agent + portal)
  - package-ecosystem: docker
    directory: /agent
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: /portal
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "docker"]
