name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # reviewdog/action-actionlint reads the PR diff and posts check results
  pull-requests: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Agent (Python)
  # ---------------------------------------------------------------------------
  agent-lint:
    name: "Agent: lint & type-check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src/tracebow --ignore-missing-imports

  agent-test:
    name: "Agent: tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: Pytest
        run: uv run pytest --tb=short -q

  # ---------------------------------------------------------------------------
  # Portal (TypeScript / React)
  # ---------------------------------------------------------------------------
  portal-lint:
    name: "Portal: lint & type-check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0

      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css,json}"

  # ---------------------------------------------------------------------------
  # CLI (Go)
  # ---------------------------------------------------------------------------
  cli-lint:
    name: "CLI: lint & vet"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracebow-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tracebow-cli/go.mod
          cache-dependency-path: tracebow-cli/go.mod

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: tracebow-cli

  cli-build:
    name: "CLI: build (cross-compile)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracebow-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tracebow-cli/go.mod
          cache-dependency-path: tracebow-cli/go.mod

      - name: Build all targets
        run: make all

  # ---------------------------------------------------------------------------
  # Policy: model provenance (block non-allowlisted LLMs in compose)
  # ---------------------------------------------------------------------------
  model-provenance:
    name: "Policy: model provenance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check compose files for denied models
        run: python scripts/check_model_provenance.py

  # ---------------------------------------------------------------------------
  # Integrations (YAML validation)
  # ---------------------------------------------------------------------------
  integrations-lint:
    name: "Integrations: YAML & Actions lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: integrations/
          config_data: |
            extends: default
            rules:
              line-length:
                max: 200
              truthy:
                check-keys: false

      - name: actionlint (GitHub Actions)
        uses: reviewdog/action-actionlint@v1
        with:
          filter_mode: nofilter

  # ---------------------------------------------------------------------------
  # Docker build smoke test
  # ---------------------------------------------------------------------------
  docker-build:
    name: "Docker: build smoke test"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        component: [agent, portal]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
