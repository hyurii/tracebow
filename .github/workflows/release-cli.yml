name: Release CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

jobs:
  build:
    name: "Build ${{ matrix.goos }}/${{ matrix.goarch }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    defaults:
      run:
        working-directory: tracebow-cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: tracebow-cli/go.mod
          cache-dependency-path: tracebow-cli/go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#cli-}"
          go build -ldflags "-s -w -X main.Version=${VERSION}" \
            -o "dist/tracebow-cli-${{ matrix.suffix }}" .

      - uses: actions/upload-artifact@v7
        with:
          name: tracebow-cli-${{ matrix.suffix }}
          path: tracebow-cli/dist/tracebow-cli-${{ matrix.suffix }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum tracebow-cli-* > checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/tracebow-cli-*
            dist/checksums-sha256.txt
