# Triggers Tracebow RCA when the CI Demo Failure workflow fails.
#
# Zero-egress: runs on the self-hosted runner co-located with Tracebow.
# Posts to http://agent:8080/api/v1/webhooks/github (internal Docker network).

name: Tracebow RCA on CI Demo Failure

on:
  workflow_run:
    workflows: ["CI Demo Failure"]
    types: [completed]

permissions:
  contents: read

jobs:
  trigger-rca:
    name: "Notify Tracebow"
    runs-on: [self-hosted, tracebow, zero-egress]
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    env:
      TRACEBOW_WEBHOOK_URL: http://agent:8080/api/v1/webhooks/github
    steps:
      - name: POST GitHub webhook
        run: |
          RUN_JSON='${{ toJson(github.event.workflow_run) }}'

          jq -n \
            --arg repository "${{ github.repository }}" \
            --argjson run "$RUN_JSON" \
            --arg event "workflow_run" \
            '{
              repository: $repository,
              run_id: $run.id,
              workflow_name: $run.name,
              head_branch: $run.head_branch,
              head_sha: $run.head_sha,
              run_url: $run.html_url,
              event: $event,
              pull_request_number: ($run.pull_requests[0].number // null)
            }' \
          | curl -sS -X POST "${TRACEBOW_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d @- \
          || true
